name: Release NOOR Android

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Validate Signing Secrets and Build Signed Release
        env:
          NOOR_RELEASE_STORE_FILE: ${{ secrets.NOOR_RELEASE_STORE_FILE }}
          NOOR_RELEASE_STORE_PASSWORD: ${{ secrets.NOOR_RELEASE_STORE_PASSWORD }}
          NOOR_RELEASE_KEY_ALIAS: ${{ secrets.NOOR_RELEASE_KEY_ALIAS }}
          NOOR_RELEASE_KEY_PASSWORD: ${{ secrets.NOOR_RELEASE_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$NOOR_RELEASE_STORE_FILE" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_STORE_FILE"; fi
          if [ -z "$NOOR_RELEASE_STORE_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_STORE_PASSWORD"; fi
          if [ -z "$NOOR_RELEASE_KEY_ALIAS" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_KEY_ALIAS"; fi
          if [ -z "$NOOR_RELEASE_KEY_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_KEY_PASSWORD"; fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "Error: Missing required release signing secrets:$MISSING_SECRETS"
            exit 1
          fi

          echo "$NOOR_RELEASE_STORE_FILE" | base64 -d > release.keystore
          export NOOR_RELEASE_STORE_FILE="$(pwd)/release.keystore"
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify APK Signature and Metadata
        id: metadata
        env:
          EXPECTED_FINGERPRINT: "6c4e68e4f8a1bc982a09611886f0eda25893642e24f14fa77642ea1a6b3ef83d"
          EXPECTED_PACKAGE: "dz.techvision.noor"
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi

          # Locate Android SDK build-tools aapt and apksigner
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ ! -x "$AAPT" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Error: Android build-tools aapt or apksigner not found."
            exit 1
          fi

          python3 -c "
          import subprocess, re, sys, hashlib, os

          apk_path = '$APK_PATH'
          expected_pkg = '$EXPECTED_PACKAGE'
          expected_fingerprint = '$EXPECTED_FINGERPRINT'
          apksigner_path = '$APKSIGNER'
          aapt_path = '$AAPT'

          # 1. Extract Badging metadata
          try:
              badging_bytes = subprocess.check_output([aapt_path, 'dump', 'badging', apk_path])
          except Exception as e:
              print(f'Error executing aapt dump badging: {e}', file=sys.stderr)
              sys.exit(1)

          badging = badging_bytes.decode('utf-8', errors='ignore')

          pkg_match = re.search(r\"^package:\\s*name='([^']+)'\", badging, re.MULTILINE)
          ver_name_match = re.search(r\"versionName='([^']+)'\", badging)
          ver_code_match = re.search(r\"versionCode='([^']+)'\", badging)

          pkg_name = pkg_match.group(1) if pkg_match else ''
          version_name = ver_name_match.group(1) if ver_name_match else ''
          version_code = ver_code_match.group(1) if ver_code_match else ''

          print(f'Extracted Package: {pkg_name}')
          print(f'Extracted Version Name: {version_name}')
          print(f'Extracted Version Code: {version_code}')

          if pkg_name != expected_pkg:
              print(f'Error: Package name mismatch. Expected {expected_pkg}, got {pkg_name}', file=sys.stderr)
              sys.exit(1)

          tag_ref = os.environ.get('GITHUB_REF_NAME', '')
          expected_tag = 'v' + version_name
          if tag_ref != expected_tag:
              print(f'Error: Git tag {tag_ref!r} does not match the built APK version {expected_tag!r}. Refusing to publish.', file=sys.stderr)
              sys.exit(1)
          print(f'Tag/version match verified: {tag_ref}')

          # 2. Verify Signature & Cert Fingerprint
          try:
              cert_bytes = subprocess.check_output([apksigner_path, 'verify', '--print-certs', apk_path])
          except Exception as e:
              print(f'Error executing apksigner verify: {e}', file=sys.stderr)
              sys.exit(1)

          cert_output = cert_bytes.decode('utf-8', errors='ignore')
          fingerprint_match = re.search(r'SHA-256 digest:\\s*([0-9a-fA-F:]+)', cert_output)
          if not fingerprint_match:
              print('Error: Could not extract SHA-256 certificate digest.', file=sys.stderr)
              sys.exit(1)

          extracted_fp = fingerprint_match.group(1).replace(':', '').lower()
          print(f'Extracted Certificate SHA-256: {extracted_fp}')
          if extracted_fp != expected_fingerprint.lower():
              print('Error: Signing certificate SHA-256 fingerprint does not match trusted production identity.', file=sys.stderr)
              sys.exit(1)

          # 3. Calculate SHA-256 Checksum
          sha256_hash = hashlib.sha256()
          with open(apk_path, 'rb') as f:
              for byte_block in iter(lambda: f.read(65536), b''):
                  sha256_hash.update(byte_block)
          apk_sha256 = sha256_hash.hexdigest()
          print(f'APK SHA-256: {apk_sha256}')

          # Write GitHub outputs
          github_output_path = os.environ.get('GITHUB_OUTPUT')
          if github_output_path:
              with open(github_output_path, 'a') as gh_out:
                  gh_out.write(f'sha256={apk_sha256}\n')
                  gh_out.write(f'versionName={version_name}\n')
                  gh_out.write(f'versionCode={version_code}\n')

          print('SUCCESS: APK verified successfully.')
          "

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
          body: |
            # NOOR ${{ steps.metadata.outputs.versionName }}

            Official release of NOOR, a privacy-focused Islamic companion for Android.

            ### Version Metadata
            * **Version Name**: `${{ steps.metadata.outputs.versionName }}`
            * **Version Code**: `${{ steps.metadata.outputs.versionCode }}`
            * **Application ID**: `dz.techvision.noor`

            ### SHA-256 Checksum
            \`\`\`
            ${{ steps.metadata.outputs.sha256 }}
            \`\`\`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
