name: Release NOOR Android

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Validate Signing Secrets and Build Signed Release
        env:
          NOOR_RELEASE_STORE_FILE: ${{ secrets.NOOR_RELEASE_STORE_FILE }}
          NOOR_RELEASE_STORE_PASSWORD: ${{ secrets.NOOR_RELEASE_STORE_PASSWORD }}
          NOOR_RELEASE_KEY_ALIAS: ${{ secrets.NOOR_RELEASE_KEY_ALIAS }}
          NOOR_RELEASE_KEY_PASSWORD: ${{ secrets.NOOR_RELEASE_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$NOOR_RELEASE_STORE_FILE" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_STORE_FILE"; fi
          if [ -z "$NOOR_RELEASE_STORE_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_STORE_PASSWORD"; fi
          if [ -z "$NOOR_RELEASE_KEY_ALIAS" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_KEY_ALIAS"; fi
          if [ -z "$NOOR_RELEASE_KEY_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS NOOR_RELEASE_KEY_PASSWORD"; fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "Error: Missing required release signing secrets:$MISSING_SECRETS"
            exit 1
          fi

          echo "$NOOR_RELEASE_STORE_FILE" | base64 -d > release.keystore
          export NOOR_RELEASE_STORE_FILE="$(pwd)/release.keystore"
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify APK Signature, Metadata, and Generate/Validate Manifest
        id: metadata
        env:
          EXPECTED_FINGERPRINT: "6c4e68e4f8a1bc982a09611886f0eda25893642e24f14fa77642ea1a6b3ef83d"
          EXPECTED_PACKAGE: "com.noor.islamic"
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi

          # Locate Android SDK build-tools aapt and apksigner
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ ! -x "$AAPT" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Error: Android build-tools aapt or apksigner not found."
            exit 1
          fi

          # 1. Verify Package Name and Version from APK
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          PKG_NAME=$(echo "$BADGING" | grep "package:" | sed -n "s/.*name='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(echo "$BADGING" | grep "package:" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(echo "$BADGING" | grep "package:" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")

          echo "Extracted Package: $PKG_NAME"
          echo "Extracted Version Name: $VERSION_NAME"
          echo "Extracted Version Code: $VERSION_CODE"

          if [ "$PKG_NAME" != "$EXPECTED_PACKAGE" ]; then
            echo "Error: Package name mismatch. Expected $EXPECTED_PACKAGE, got $PKG_NAME"
            exit 1
          fi

          # 2. Verify APK Signature and Certificate Fingerprint
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "Signing verification output:"
          echo "$CERT_OUTPUT"

          FINGERPRINT=$(echo "$CERT_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          echo "Extracted Certificate SHA-256: $FINGERPRINT"
          echo "Expected Certificate SHA-256:  $EXPECTED_FINGERPRINT"

          if [ "$FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "Error: Signing certificate SHA-256 fingerprint does not match trusted production identity."
            exit 1
          fi

          # 3. Calculate SHA-256 Checksum of exact APK
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK SHA-256: $SHA256"

          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT

          # 4. Generate and Rigorously Validate JSON Update Manifest via Python
          python3 -c "
          import json, sys, re

          expected_pkg = '$EXPECTED_PACKAGE'
          expected_version_name = '$VERSION_NAME'
          expected_version_code = int('$VERSION_CODE')
          expected_sha256 = '$SHA256'
          expected_asset = 'app-release.apk'

          manifest_data = {
              'schemaVersion': 1,
              'versionName': expected_version_name,
              'versionCode': expected_version_code,
              'minimumSupportedVersionCode': 1,
              'mandatory': False,
              'apkAsset': expected_asset,
              'sha256': expected_sha256,
              'releaseNotes': {
                  'en': 'Official release of NOOR v' + expected_version_name + '.',
                  'ar': 'الإصدار الرسمي لتطبيق نور v' + expected_version_name + '.',
                  'fr': 'Version officielle de NOOR v' + expected_version_name + '.'
              },
              'publishedAt': '$(date -u +"%Y-%m-%dT%H:%M:%SZ")'
          }

          # Write UTF-8 JSON
          manifest_path = 'noor-update.json'
          with open(manifest_path, 'w', encoding='utf-8') as f:
              json.dump(manifest_data, f, indent=2, ensure_ascii=False)

          # Rigorous Validation
          with open(manifest_path, 'r', encoding='utf-8') as f:
              parsed = json.load(f)

          if not isinstance(parsed, dict):
              print('Error: Root JSON value is not an object.', file=sys.stderr)
              sys.exit(1)

          required_fields = [
              'schemaVersion', 'versionName', 'versionCode', 
              'minimumSupportedVersionCode', 'mandatory', 
              'apkAsset', 'sha256', 'releaseNotes', 'publishedAt'
          ]

          for field in required_fields:
              if field not in parsed:
                  print(f'Error: Missing required field: {field}', file=sys.stderr)
                  sys.exit(1)

          # Type and value checks
          if not isinstance(parsed['versionCode'], int) or isinstance(parsed['versionCode'], bool) or parsed['versionCode'] <= 0:
              print('Error: versionCode must be a positive integer.', file=sys.stderr)
              sys.exit(1)

          if parsed['versionCode'] != expected_version_code:
              print(f'Error: versionCode mismatch: manifest has {parsed[\"versionCode\"]}, APK has {expected_version_code}', file=sys.stderr)
              sys.exit(1)

          if parsed['versionName'] != expected_version_name:
              print(f'Error: versionName mismatch: manifest has {parsed[\"versionName\"]}, APK has {expected_version_name}', file=sys.stderr)
              sys.exit(1)

          if parsed['apkAsset'] != expected_asset:
              print(f'Error: apkAsset must be {expected_asset}', file=sys.stderr)
              sys.exit(1)

          sha_regex = re.compile(r'^[a-fA-F0-9]{64}$')
          if not isinstance(parsed['sha256'], str) or not sha_regex.match(parsed['sha256']):
              print('Error: sha256 must be exactly 64 hexadecimal characters.', file=sys.stderr)
              sys.exit(1)

          if parsed['sha256'].lower() != expected_sha256.lower():
              print('Error: sha256 checksum mismatch with uploaded APK.', file=sys.stderr)
              sys.exit(1)

          print('SUCCESS: noor-update.json generated and validated successfully.')
          "

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            noor-update.json
          body: |
            # NOOR ${{ steps.metadata.outputs.versionName }}

            Official release of NOOR, a privacy-focused Islamic companion for Android.

            ### Version Metadata
            * **Version Name**: `${{ steps.metadata.outputs.versionName }}`
            * **Version Code**: `${{ steps.metadata.outputs.versionCode }}`
            * **Application ID**: `com.noor.islamic`

            ### SHA-256 Checksum
            \`\`\`
            ${{ steps.metadata.outputs.sha256 }}
            \`\`\`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
