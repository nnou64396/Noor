# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/gradle_properties.html

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# Required so KSP (Room) can register generated source dirs under built-in Kotlin.
android.disallowKotlinSourceSets=false

# Kotlin
kotlin.code.style=official
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
